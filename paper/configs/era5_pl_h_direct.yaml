# ERA5-PL direct (paper appendix): SQF-H trained directly on ERA5 pressure-level inputs, no decoupling.
name: sqfh_era5pl_wrf_direct
data:
  root: data/nl
  inputs: 3_inputs/era5_pl.nc
forcings: [z_agl, lz]
targets: [lcn2, QKE, TSQ, EL_PBL]
scalers_X:
  z_agl: [null, quantile, [0.0, 0.99]]   # as trained: ERA5 heights scaled by quantiles, WRF-PL by min / max
model:
  name: sqf_h                 # otprof.models.sqf_h: inputs, data processing, network
  embed_dim: 48
  num_blocks: 4
  num_heads: 2
  head_dim: 512
  conv_kernel_size: 3
  use_conf_head: true
training:
  batch_size: 23552
  max_epochs: 600
  lr: 1.0e-3
