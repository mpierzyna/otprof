[project]
name = "otprof"
version = "0.2.1"
description = "OTProf: high-resolution profiles of optical turbulence (Cn2) from reanalysis and forecasts using deep learning"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["COPYING"]
dependencies = [
    "numpy>=2.0",
    "xarray>=2024.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Building training data: ERA5 download, alignment with WRF, WRF adapter interpolation
data = [
    "scipy>=1.11",
    "netcdf4>=1.6",
    "gcsfs>=2024.1",
    "zarr>=2.16",
    "dask>=2024.1",
    "pyyaml>=6",
]
# Loading and running models: the network, safetensors weights
torch = [
    "torch>=2.4",
    "safetensors>=0.4",
]
# Downloading models from Hugging Face
hub = [
    "huggingface_hub>=0.20",
]
# Training: Lightning loop, TensorBoard logging with sample plots
train = [
    "otprof[torch]",
    "lightning>=2.4",
    "tensorboardx>=2.6",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "otprof[data,train,hub]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otprof"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
