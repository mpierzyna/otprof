[project]
name = "otprof"
version = "0.2.5"
description = "OTProf: high-resolution profiles of optical turbulence (Cn2) from reanalysis and forecasts using deep learning"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later AND Apache-2.0"
license-files = ["LICENSES/*.txt"]
authors = [
    { name = "Maximilian Pierzyna" },
]
dependencies = [
    "numpy>=2.0",
    "xarray>=2024.1",
    "pydantic>=2.0",
    # Dataset files, experiment configs, output quantile mapping, WRF interpolation
    "netcdf4>=1.6",
    "pyyaml>=6",
    "scipy>=1.11",
    # ERA5 from the ARCO store
    "gcsfs>=2024.1",
    "zarr>=2.16",
    # Network, weights, published models
    "torch>=2.4",
    "safetensors>=0.4",
    "huggingface_hub>=0.20",
    # Training: Lightning loop, TensorBoard logging with sample plots
    "lightning>=2.4",
    "tensorboardx>=2.6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Building training data with bulk ERA5 downloads from the CDS (otprof.sources.era5_cds)
data = [
    "dask>=2024.1",
    "ecmwf-datastores-client>=0.4",
    "cfgrib>=0.9.15",
    "eccodes>=2.41",
    "eccodeslib>=2.50.0.33",
    "tqdm>=4.60",
]
# GFS forecasts (otprof.sources.gfs, gfs_archive): GRIB decoding
gfs = [
    "cfgrib>=0.9.15",
    "eccodes>=2.41",
    "eccodeslib>=2.50.0.33",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "otprof[data,gfs]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otprof"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

# Release: `uvx bump-my-version bump patch|minor|major` updates the files below, commits and tags
[tool.bumpversion]
current_version = "0.2.5"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump version: {current_version} → {new_version}"

# Edited as text: `uv lock` in a workspace checkout would update the workspace's lockfile, not this one
[[tool.bumpversion.files]]
filename = "uv.lock"
regex = true
search = '^name = "otprof"\nversion = "\d+\.\d+\.\d+"$'
replace = """name = "otprof"
version = "{new_version}\""""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = """
name = "otprof"
version = "{current_version}"
"""
replace = """
name = "otprof"
version = "{new_version}"
"""

# The software's version and release date only, not the versions of its references
[[tool.bumpversion.files]]
filename = "CITATION.cff"
regex = true
search = '^version: {current_version}\ndate-released: "\d{{4}}-\d{{2}}-\d{{2}}"$'
replace = """version: {new_version}
date-released: "{now:%Y-%m-%d}\""""

# Zenodo DOIs and the Zenodo citation in README.md are static on purpose and not bumped
[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = "/tree/v{current_version}"
replace = "/tree/v{new_version}"
