[project]
name = "otprof"
version = "0.1.0"
description = "OTProf: high-resolution profiles of optical turbulence (Cn2) from reanalysis and forecasts using deep learning"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["COPYING"]
dependencies = [
    "numpy>=2.0",
    "xarray>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otprof"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
