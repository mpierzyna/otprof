[project]
name = "otprof"
version = "0.2.3"
description = "OTProf: high-resolution profiles of optical turbulence (Cn2) from reanalysis and forecasts using deep learning"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later AND Apache-2.0"
license-files = ["LICENSES/*.txt"]
authors = [
    { name = "Maximilian Pierzyna" },
]
dependencies = [
    "numpy>=2.0",
    "xarray>=2024.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Building training data: ERA5 download, alignment with WRF, WRF adapter interpolation
data = [
    "scipy>=1.11",
    "netcdf4>=1.6",
    "gcsfs>=2024.1",
    "zarr>=2.16",
    "dask>=2024.1",
    "pyyaml>=6",
    "ecmwf-datastores-client>=0.4",
    "cfgrib>=0.9.15",
    "eccodes>=2.41",
    "eccodeslib>=2.50.0.33",
    "tqdm>=4.60",
]
# Loading and running models: the network, safetensors weights
torch = [
    "torch>=2.4",
    "safetensors>=0.4",
]
# GFS forecasts (otprof.sources.gfs, gfs_archive): GRIB decoding
gfs = [
    "cfgrib>=0.9.15",
    "eccodes>=2.41",
    "eccodeslib>=2.50.0.33",
]
# Downloading models from Hugging Face
hub = [
    "huggingface_hub>=0.20",
]
# Training: Lightning loop, TensorBoard logging with sample plots
train = [
    "otprof[torch]",
    "lightning>=2.4",
    "tensorboardx>=2.6",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "otprof[data,train,hub,gfs]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otprof"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

# Release: `uvx bump-my-version bump patch|minor|major` updates the files below, commits and tags
[tool.bumpversion]
current_version = "0.2.3"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump version: {current_version} → {new_version}"
# uv.lock is regenerated instead of edited as text, so it also recovers if it was out of sync
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = """
name = "otprof"
version = "{current_version}"
"""
replace = """
name = "otprof"
version = "{new_version}"
"""

# The software's version and release date only, not the versions of its references
[[tool.bumpversion.files]]
filename = "CITATION.cff"
regex = true
search = '^version: {current_version}\ndate-released: "\d{{4}}-\d{{2}}-\d{{2}}"$'
replace = """version: {new_version}
date-released: "{now:%Y-%m-%d}\""""

# Zenodo DOIs and the Zenodo citation in README.md are static on purpose and not bumped
[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = "/tree/v{current_version}"
replace = "/tree/v{new_version}"
